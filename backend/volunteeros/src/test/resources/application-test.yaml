spring:
  application:
    name: volunteeros
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/volunteeros_db_dev
    username: volunteer
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml

server:
  host: localhost
  port: 8080

security:
  csrf-enabled: false