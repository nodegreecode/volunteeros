services:
  postgres:
    image: postgres:17
    container_name: volunteeros_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - volunteeros_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: volunteeros_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - volunteeros_redis_data:/data
    command: redis-server --appendonly yes

  elasticsearch:
    image: elasticsearch:9.0.4
    container_name: volunteeros_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_HOST_PORT}:9200"
    volumes:
      - volunteeros_elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  volunteeros_postgres_data:
  volunteeros_redis_data:
  volunteeros_elasticsearch_data: