  url: "{{baseUrl}}/api/users/profile/image"
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value:
          - /home/zenmaster/Downloads/images.jpeg
        contentType: image/jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
